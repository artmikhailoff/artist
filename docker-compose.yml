services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${ARTIST_IMAGE:-artist}:${ARTIST_TAG:-latest}
    container_name: ${ARTIST_CONTAINER_NAME:-artist}
    restart: unless-stopped
    ports:
      # Host :443 is stunnel on Liquid Web — publish HTTPS on 8443.
      - "${ARTIST_HTTP_PORT:-80}:80"
      - "${ARTIST_HTTPS_PORT:-8443}:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    environment:
      ARTIST_DOMAIN: ${ARTIST_DOMAIN:-kasabov.northlayertech.com}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  caddy_data:
  caddy_config:
